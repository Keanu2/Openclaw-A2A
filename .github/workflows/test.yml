name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: a2a-plugin
    strategy:
      matrix:
        node-version: [22, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm test
      - run: node --test server/file-relay.test.cjs
        working-directory: .
