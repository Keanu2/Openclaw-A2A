worker_processes 1;
pid /tmp/openclaw-a2a-nginx.pid;
error_log /var/log/openclaw-a2a/error.log info;

events { worker_connections 2048; }

stream {
    log_format edge '$time_iso8601 $remote_addr:$remote_port $protocol '
                    'status=$status sent=$bytes_sent received=$bytes_received duration=$session_time '
                    'sni=$ssl_preread_server_name';
    access_log /var/log/openclaw-a2a/access.log edge;

    map $ssl_preread_server_name $a2a_upstream {
        a2a-file.invalid 127.0.0.1:19185;
        default          127.0.0.1:18001;
    }

    # One public port: plaintext WS control traffic follows default; the TLS
    # file connection is selected by SNI and terminated on the loopback hop.
    server {
        listen 8001;
        ssl_preread on;
        proxy_connect_timeout 10s;
        proxy_timeout 35m;
        proxy_socket_keepalive on;
        proxy_pass $a2a_upstream;
    }

    server {
        listen 127.0.0.1:19185 ssl;
        proxy_connect_timeout 10s;
        proxy_timeout 35m;
        proxy_buffer_size 256k;
        proxy_socket_keepalive on;
        tcp_nodelay on;
        ssl_certificate /etc/openclaw-a2a/tls.crt;
        ssl_certificate_key /etc/openclaw-a2a/tls.key;
        ssl_protocols TLSv1.3;
        proxy_pass 127.0.0.1:19182;
    }
}
